                pageAccessToken: { type: string, minLength: 20, writeOnly: true }
      responses:
        '201': { description: Đã kết nối }
        '400': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
  /v1/shops/{shopId}/channels/{channelId}:
    parameters:
      - { $ref: '#/components/parameters/ShopId' }
