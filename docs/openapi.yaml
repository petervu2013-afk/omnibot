      schema: { type: string }
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    X-Request-Id:
      description: Mã yêu cầu (giữ nguyên nếu client gửi giá trị an toàn 8–128 ký tự [A-Za-z0-9_.-], nếu không server tự sinh UUID). Có trong mọi phản hồi và log.
      schema: { type: string }
  responses:
    Failure:
      description: Lỗi theo định dạng chung (xem mã lỗi trong error.code)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Accepted:
      description: Đã nhận yêu cầu
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    AuthIssued:
      description: Cấp token. Web nhận refresh token trong cookie HttpOnly `omnibot_rt` (Path=/v1/auth) và không có `refreshToken` trong body; ANDROID/IOS nhận trong body.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthTokens' }
    RateLimited:
      description: Vượt giới hạn tần suất (mặc định 120 yêu cầu/phút/IP)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: RATE_LIMITED, message: 'Bạn thao tác quá nhanh, vui lòng thử lại sau ít phút.' }, requestId: 3f0c… }
  schemas:
    Stage:
      type: string
      enum: [NEW, CONTACTING, CONSULTING, QUOTED, WON, NURTURING, LOST]
    ProductInput:
      type: object
      additionalProperties: false
      required: [sku, name, price]
      properties:
        sku: { type: string }
        name: { type: string }
        categoryId: { type: [string, 'null'] }
        price: { type: integer, minimum: 0 }
        costPrice: { type: [integer, 'null'], minimum: 0 }
        description: { type: [string, 'null'] }
        barcode: { type: [string, 'null'] }
        active: { type: boolean }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        stage: { $ref: '#/components/schemas/Stage' }
        expectedValue: { type: [integer, 'null'] }
    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string }
    RegisterRequest:
      type: object
      required: [fullName, email, password, shopName, acceptTerms]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, maxLength: 128, description: '≥ 8 ký tự, có chữ và số, không phổ biến, không chứa tên email' }
        shopName: { type: string, minLength: 2, maxLength: 100 }
        field: { type: string, maxLength: 60 }
        phone: { type: string }
        acceptTerms: { type: boolean, const: true }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        deviceName: { type: string, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, maxLength: 128 }
        captcha: { type: string, description: Token Cloudflare Turnstile, bắt buộc từ lần sai thứ 3 }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        deviceName: { type: string, maxLength: 100 }
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string, description: Chỉ mobile; web dùng cookie }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ClientPlatform:
      type: string
      enum: [WEB, ANDROID, IOS]
      default: WEB
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, LOCKED, PENDING_DELETION, DELETED] }
        emailVerifiedAt: { type: [string, 'null'], format: date-time }
        verifyDeadline: { type: [string, 'null'], format: date-time }
        deletionRequestedAt: { type: [string, 'null'], format: date-time }
        purgeAt: { type: [string, 'null'], format: date-time }
    ShopRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [ADMIN, MANAGER, SALE, WAREHOUSE] }
        isOwner: { type: boolean }
        permissions:
          type: array
          description: Quyền của vai trò trong shop này; chỉ dùng để hiển thị, API vẫn kiểm tra mỗi yêu cầu
          items: { type: string }
    Me:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        shops:
          type: array
          items: { $ref: '#/components/schemas/ShopRef' }
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string, description: JWT, gửi qua header Authorization Bearer }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, description: Chỉ có với ANDROID/IOS }
        refreshTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        shops:
          type: array
          items: { $ref: '#/components/schemas/ShopRef' }
    Session:
      type: object
      properties:
        id: { type: string, description: Mã phiên ổn định qua các lần xoay vòng }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        deviceName: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
    Health:
      type: object
      required: [status, db, redis, uptime]
      properties:
        status: { type: string, enum: [ok, error] }
        db: { type: string, enum: [ok, down] }
        redis: { type: string, enum: [ok, down] }
        uptime: { type: integer, description: Số giây từ khi tiến trình khởi động }
    Error:
      type: object
      description: Định dạng lỗi chung cho mọi API. Lỗi 5xx không chứa chi tiết nội bộ.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'BAD_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, VALIDATION_FAILED, PAYLOAD_TOO_LARGE, RATE_LIMITED, INTERNAL_ERROR, … hoặc mã nghiệp vụ riêng' }
            message: { type: string, description: Thông báo tiếng Việt hiển thị được cho người dùng }
            details: { description: Chi tiết lỗi từng trường (khi có) }
        requestId: { type: string }
 }
